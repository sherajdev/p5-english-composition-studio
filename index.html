<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Composition Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one calm column. Hero with a self-drawing story mountain, filter chips, paper cards, then a paper page with mountain, questions and planner. */
:root{
  color-scheme:light;
  --bg:#D9F3FD; --surface:#FFFFFF; --ink:#33408F; --muted:#4C5897; --line:#B7DFF3;
  --accent:#3DBFA8; --accent-ink:#1B7A6B; --soft:#E2F8F1;
  --sky:#5AA9F0; --sky-soft:#E3F1FF; --coral:#FF8A80; --coral-soft:#FFE6E3; --sun:#FFC24B; --sun-soft:#FFF3D1;
  --pink:#FFC6D9; --lav:#E6DDFF; --mint:#C9F0DE; --orange:#FFB02E;
  --shadow:5px 6px 0 rgba(51,64,143,.12);
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1040px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--accent-ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(2.1rem,5.5vw,3.4rem);margin-block:8px 12px}
.hero h1 em{font-style:normal;color:var(--accent-ink);background:linear-gradient(transparent 62%,var(--sun) 62% 92%,transparent 92%)}
.hero p.lead{color:var(--muted);max-width:46ch;font-size:1.05rem}
.hero-art{position:relative;min-width:0}
.hero-art svg{width:100%;height:auto;display:block;overflow:visible}
.mtn-fill{fill:var(--soft)}
.mtn-line{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.flag{animation:wave 1.6s ease-in-out infinite;transform-origin:0 0}
@keyframes wave{50%{transform:rotate(-8deg)}}
.cloud{fill:var(--surface);stroke:var(--line);stroke-width:2;animation:drift 9s ease-in-out infinite alternate}
.cloud.c2{animation-duration:12s;animation-delay:-4s}
@keyframes drift{to{transform:translateX(26px)}}
.hiker{animation:hike 7s ease-in-out infinite}
@keyframes hike{0%{transform:translate(40px,196px)}22%{transform:translate(150px,150px)}50%{transform:translate(300px,52px)}72%{transform:translate(410px,128px)}100%{transform:translate(520px,196px)}}
.stage-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stage-chips span{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* filters */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.filters{display:grid;gap:16px;margin-top:8px}
.filters h2{font-size:1.25rem}
.fgroup{display:grid;gap:8px}
.fgroup > .label{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;overflow:hidden;border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,border-color .15s,background .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--dot,var(--accent))}
.chip .n{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);background:var(--surface);border-radius:99px;padding:0 7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{background:transparent;color:var(--bg)}
.freq{height:4px;border-radius:2px;background:var(--dot,var(--accent));position:absolute;left:0;bottom:0;width:0;animation:grow 1s .5s ease-out forwards;opacity:.9}
@keyframes grow{to{width:var(--w)}}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-block:24px 12px;color:var(--muted);font-weight:700}
.status button{background:none;border:none;color:var(--accent-ink);font-weight:800;text-decoration:underline;padding:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.card{display:grid;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .5s both;animation-delay:calc(var(--i)*45ms);min-width:0}
.card:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs img,.pic img{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
.thumbs img{aspect-ratio:1;object-fit:contain;border:1px solid var(--line)}
.noimg{aspect-ratio:3.2/1;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:.82rem;color:var(--muted);padding:8px}
.card h3{font-size:1.25rem}
.card .school{font-weight:800;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;font-weight:800;border-radius:99px;padding:2px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--dot);display:block}
.go{font-weight:800;color:var(--accent-ink);display:flex;gap:6px;align-items:center}
.go svg{transition:transform .2s}.card:hover .go svg{transform:translateX(5px)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* toolkit */
section.toolkit{margin-top:56px;display:grid;gap:20px}
.toolkit h2{font-size:1.8rem}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start}
.tip h3{font-size:1.05rem}
.tip .swap{display:grid;gap:4px;font-size:.92rem}
.tip .bad{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--coral)}
.tip .good{font-weight:700}
.tip .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent-ink);font-family:var(--display);font-weight:700}
.note{color:var(--muted);font-size:.9rem}

/* paper page */
.back{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:800;margin-block:24px 8px}
.back:hover{border-color:var(--accent)}
.phead{display:grid;gap:8px;padding-block:8px 20px}
.phead h1{font-size:clamp(2rem,5vw,3rem)}
.prompt{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:start}
.prompt h3{font-size:1.1rem;margin-bottom:8px}
.guide{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.guide li{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.guide li b{font-family:var(--display);color:var(--ink);background:var(--sun);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:.85rem}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:0}
.pic{display:grid;gap:6px;align-content:start;min-width:0}
.pic img{border:1px solid var(--line);transition:transform .25s}
.pic:hover img{transform:scale(1.04) rotate(-1deg)}
.pic p{font-size:.82rem;color:var(--muted);line-height:1.35}
.sec{margin-top:40px;display:grid;gap:16px}
.sec > h2{font-size:1.6rem}
.sec > .sub{color:var(--muted);max-width:68ch;margin-top:-8px}

/* mountain */
.mtn-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center}
.mtn-svg{width:100%;height:auto;display:block;overflow:visible;min-width:0}
.stagebtn{cursor:pointer}
.stagebtn circle{fill:var(--surface);stroke:var(--line);stroke-width:3;transition:all .25s}
.stagebtn text{font:700 12px var(--body);fill:var(--muted);text-anchor:middle;transition:fill .2s}
.stagebtn.on circle{fill:var(--sun);stroke:var(--ink);r:15}
.stagebtn.on text{fill:var(--ink)}
.stagebtn:focus-visible{outline:none}.stagebtn:focus-visible circle{stroke:var(--sky);stroke-width:5}
.walker{transition:transform .8s cubic-bezier(.5,-0.3,.3,1.3)}
.walker .bob{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.stagebox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow);min-width:0}
.stagebox .badge{justify-self:start;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;background:var(--sun);color:#16213E;padding:3px 12px}
.stagebox h3{font-size:1.4rem}
.stagebox .ex{background:var(--soft);border-radius:12px;padding:10px 12px;font-style:italic}
.stagebox .exlabel{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-style:normal;display:block;margin-bottom:2px}
.stagebox .fade{animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.mtn-ctrl{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 18px;font-weight:800;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{font-size:.85rem;font-weight:700;background:var(--sky-soft);color:var(--ink);border-radius:8px;padding:2px 10px}

/* questions */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--muted)}
.bar{width:140px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--sun));border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.qlist{display:grid;gap:12px;counter-reset:q}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;transition:border-color .2s,background .2s}
.q.done{border-color:var(--accent);background:linear-gradient(var(--soft),var(--soft)) var(--surface)}
.q .top{display:flex;gap:12px;align-items:flex-start}
.q .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.q.done .num{background:var(--accent)}
.q .text{font-weight:800;font-size:1.05rem;min-width:0}
.q .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;font-weight:800;font-size:.86rem}
.small:hover{border-color:var(--accent)}
.small.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#04201C}
.example{background:var(--sun-soft);border-radius:12px;padding:12px 14px;display:grid;gap:2px;animation:fadein .3s}
.example .exlabel{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.example q{quotes:none;font-style:italic}
.burst{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:50}
.burst span{position:absolute;width:12px;height:12px;background:var(--c);border-radius:3px;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* planner */
.planner{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.planner label{display:grid;gap:6px;font-weight:800;font-size:.85rem;min-width:0}
.planner label span{display:flex;align-items:center;gap:6px}
.planner label span i{width:10px;height:10px;border-radius:50%;background:var(--sun)}
.planner textarea{font:inherit;font-weight:400;font-size:.92rem;width:100%;min-height:120px;resize:vertical;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.planner textarea:focus{outline:none;border-color:var(--accent)}
.foot{margin-top:56px;color:var(--muted);font-size:.85rem;text-align:center}
@media (max-width:820px){
  .hero,.prompt,.mtn-wrap{grid-template-columns:1fr}
  .planner{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.planner{grid-template-columns:1fr}.bar{width:100px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .mtn-line{stroke-dashoffset:0}
}

/* ===== paper & cartoon skin ===== */
body{position:relative;overflow-x:hidden}
.wrap{position:relative;z-index:1}
.decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.decor .cl{position:absolute;width:150px;opacity:.9;animation:drift 14s ease-in-out infinite alternate}
.decor .d1{top:12%;left:-30px}.decor .d2{top:46%;right:-40px;width:190px;animation-duration:18s}.decor .d3{bottom:8%;left:12%;width:120px;animation-duration:11s}
@keyframes drift{to{transform:translateX(34px)}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 0;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--ink)}
.pill{display:flex;gap:4px;background:rgba(255,255,255,.7);border-radius:99px;padding:5px;box-shadow:3px 3px 0 rgba(51,64,143,.1)}
.pill button{background:none;border:none;border-radius:99px;padding:6px 16px;font-weight:700;color:var(--ink)}
.pill button:hover{background:var(--sun-soft)}
.hero{display:block;text-align:center;padding-block:28px 0}
.hero h1{margin:6px 0 0}
.hero h1 .l1{display:block;font-size:clamp(3.2rem,12vw,8rem);color:var(--ink);font-weight:700;letter-spacing:-.02em;line-height:.95}
.hero h1 .l2{display:block;font-size:clamp(3.6rem,14vw,9.4rem);color:var(--orange);font-weight:700;line-height:.9;margin-top:-.06em;text-shadow:4px 4px 0 rgba(255,255,255,.9);animation:wob 4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-1.5deg) scale(1.02)}}
.hero p.lead{margin:16px auto 18px;max-width:46ch;color:var(--ink);font-size:1.08rem}
.hero .eyebrow{color:var(--ink);background:rgba(255,255,255,.7);display:inline-block;border-radius:99px;padding:3px 14px}
.btn{background:var(--orange);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 4px 0 var(--ink);padding:9px 22px}
.btn:hover{transform:translate(-1px,-2px);box-shadow:4px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--ink)}
.scene{position:relative;max-width:760px;height:clamp(240px,42vw,340px);margin:6px auto 0}
.scene .mt{position:absolute;left:50%;bottom:0;width:min(78%,520px);transform:translateX(-50%)}
.scene svg{display:block;overflow:visible}
.scene .sun{position:absolute;left:-2%;bottom:-4%;width:clamp(100px,22vw,170px)}
.scene .c1{position:absolute;left:14%;top:6%;width:clamp(80px,17vw,130px);animation:drift 8s ease-in-out infinite alternate}
.scene .c2{position:absolute;right:10%;top:0;width:clamp(70px,15vw,115px);animation:drift 10s -3s ease-in-out infinite alternate}
.scene .c3{position:absolute;right:26%;bottom:6%;width:clamp(60px,11vw,90px);animation:drift 7s -2s ease-in-out infinite alternate}
.scene .pencil{position:absolute;right:0;bottom:0;width:clamp(48px,9vw,78px);transform-origin:50% 100%;animation:bounce 1.8s ease-in-out infinite;transform:rotate(14deg)}
@keyframes bounce{50%{transform:rotate(14deg) translateY(-14px)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.paper{filter:drop-shadow(0 6px 0 rgba(51,64,143,.16))}
.mtn-fill{fill:var(--mint)}
.panel{border:3px solid #fff;border-radius:28px;box-shadow:var(--shadow)}
.chip{background:#fff;border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}
.chip:hover{transform:translate(-1px,-2px);box-shadow:3px 5px 0 var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--ink)}
.freq{height:5px;border-radius:3px}
.card{border:3px solid #fff;border-radius:26px;box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg))}
.card:nth-child(3n+1){--tilt:-.7deg}.card:nth-child(3n+2){--tilt:.5deg}.card:nth-child(3n){--tilt:-.3deg}
.card:hover{transform:translateY(-6px) rotate(0);border-color:var(--sun)}
.card .thumbs img{border:2px solid var(--line);border-radius:12px}
.card:nth-child(4n+1){background:#fff}
.card:nth-child(4n+2){background:linear-gradient(#FFF8E1,#FFF8E1)}
.card:nth-child(4n+3){background:linear-gradient(#FFF0F5,#FFF0F5)}
.card:nth-child(4n){background:linear-gradient(#EFFAF4,#EFFAF4)}
.card h3{color:var(--ink)}
.tag{background:#fff;border:2px solid var(--line)}
.status{color:var(--ink)}
section.toolkit{background:var(--sun-soft);border:3px solid #fff;border-radius:36px;padding:28px;box-shadow:var(--shadow)}
.tip{border:3px solid #fff;border-radius:22px;box-shadow:3px 4px 0 rgba(51,64,143,.1)}
.tip:nth-child(odd){transform:rotate(-.6deg)}.tip:nth-child(even){transform:rotate(.6deg)}
.tip .ico{background:var(--pink);color:var(--ink);border-radius:50%}
.back{border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink);background:#fff}
.back:hover{border-color:var(--ink);transform:translate(-1px,-1px)}
.stagebox{border:3px solid #fff;border-radius:26px}
.stagebox .badge{background:var(--pink);color:var(--ink)}
.stagebox .ex{background:var(--sky-soft)}
.example{background:var(--sun-soft);border:2px dashed var(--sun)}
.q{border:3px solid #fff;border-radius:24px;box-shadow:3px 4px 0 rgba(51,64,143,.1)}
.q.done{background:linear-gradient(#EAFBF4,#EAFBF4);border-color:var(--accent)}
.small{background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.small:hover{border-color:var(--ink);transform:translate(-1px,-1px)}
.small.check[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--ink)}
.guide li{background:var(--sun-soft)}
.words span{background:#fff;border:2px solid var(--line)}
.planner textarea{border:2.5px solid var(--line);background:#fff;border-radius:16px}
.planner textarea:focus{border-color:var(--ink)}
.bar{background:#fff}
.pic img{border:2px solid var(--line);border-radius:12px}
.noimg{background:rgba(255,255,255,.6);border-color:var(--ink)}
.foot{color:var(--ink)}
@media (max-width:520px){.decor .d2{display:none}.nav{justify-content:center}}

.pill{flex-wrap:wrap;justify-content:center}
.pill button{padding:6px 12px;font-size:.92rem}
.mstops{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.mstop{background:var(--c);border:3px solid #fff;border-radius:24px;padding:16px;display:grid;gap:6px;align-content:start;box-shadow:var(--shadow);animation:rise .5s both;animation-delay:calc(var(--i)*80ms)}
.mstop:nth-child(odd){transform:rotate(-.6deg)}.mstop:nth-child(even){transform:rotate(.6deg)}
.mnum{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:2.5px solid var(--ink)}
.mstop h3{font-size:1.2rem}.mstop p{font-size:.92rem}.sub2{font-weight:800;color:var(--muted)}
.mbar{display:flex;align-items:center;gap:8px;margin-top:4px}
.mbar i{display:block;height:10px;border-radius:99px;background:var(--ink);width:0;animation:grow 1s .4s ease-out forwards}
.mbar b{font-size:.85rem}
.search{font:inherit;width:100%;max-width:360px;padding:10px 16px;border-radius:99px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:2px 3px 0 var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.vcard{background:var(--c);border:3px solid #fff;border-radius:24px;padding:16px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow);min-width:0}
.vcard h3{font-size:1.15rem}
.vrow{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:start}
.vrow .plain{font-weight:800;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--coral);padding-top:3px}
.vrow .arr{padding-top:3px}
.rich{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.word{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;font-size:.9rem;box-shadow:1px 2px 0 var(--ink);transition:transform .15s}
.word:hover{transform:translateY(-2px)}
.word.got{background:var(--mint);box-shadow:none;transform:translateY(1px)}
.word.got::after{content:" ✓"}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--bg);font-weight:700;cursor:pointer;transition:background .2s}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.chk.on{background:var(--mint)}.chk.on span{text-decoration:line-through;text-decoration-color:var(--accent)}
html{scroll-padding-top:12px;overflow-x:hidden}.scene{overflow:visible}

.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.model{background:#fff;border:3px solid #fff;border-radius:26px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow);align-content:start;min-width:0}
.model h3{font-size:1.3rem}
.mp{background:var(--c);border-radius:16px;padding:10px 12px;display:grid;gap:4px;transition:background .3s}
.models.plain .mp{background:transparent;padding-inline:0}
.mlabel{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mtech{justify-self:start;font-size:.78rem;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 10px}
.models.plain .mtech,.models.plain .mlabel{display:none}
.pr-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.timer{font-family:var(--display);font-weight:700;font-size:1.8rem;min-width:5.5ch;font-variant-numeric:tabular-nums;color:var(--ink)}
#pbox .pics{max-width:600px}.reveal .btn{justify-self:start}.reveal{margin-top:16px;display:grid;gap:10px;animation:fadein .4s}
#pbox .pic img{aspect-ratio:1;object-fit:contain;background:#fff}
</style>

function wireExtras(){
  let learnt=store.get("zayd-words",[]);
  const topicBanks=[...new Set(PAPERS.map(p=>p.key))].map(k=>({t:PAPERS.find(p=>p.key===k).topic,words:T[k].w}));
  const wordBtn=w=>`<button class="word ${learnt.includes(w)?"got":""}" data-w="${esc(w)}" aria-pressed="${learnt.includes(w)}">${esc(w)}</button>`;
  const card=g=>`<div class="vcard" style="--c:var(--${g.c||"sky"}${g.c==="sun"?"-soft":g.c==="sky"?"-soft":""})"><h3>${esc(g.t)}</h3>${g.rows?g.rows.map(r=>`<div class="vrow"><span class="plain">${esc(r[0])}</span><span class="arr">→</span><span class="rich">${r[1].split(", ").map(wordBtn).join("")}</span></div>`).join(""):`<div class="rich">${g.words.map(wordBtn).join("")}</div>`}</div>`;
  function draw(q=""){
    const f=g=>{const s=q.toLowerCase();if(!s)return true;return JSON.stringify(g).toLowerCase().includes(s)};
    $("#vgrid").innerHTML=VOCAB.filter(f).map(card).join("")||'<p class="note">No words match.</p>';
    $("#vtopics").innerHTML=topicBanks.filter(f).map(b=>card({t:b.t,c:"mint",words:b.words})).join("");
    $("#wcount").textContent=`${learnt.length} ${learnt.length===1?"word":"words"} learnt`;
  }
  draw();
  $("#vsearch").oninput=e=>draw(e.target.value.trim());
  $("#vocab").onclick=e=>{const b=e.target.closest(".word");if(!b)return;const w=b.dataset.w;learnt=learnt.includes(w)?learnt.filter(x=>x!==w):[...learnt,w];store.set("zayd-words",learnt);draw($("#vsearch").value.trim());if(learnt.includes(w))burst(b)};
  let ticks=store.get("zayd-checks",[]);
  function drawC(){
    $("#checks").innerHTML=CHECK.map((c,i)=>`<label class="chk ${ticks.includes(i)?"on":""}"><input type="checkbox" data-i="${i}" ${ticks.includes(i)?"checked":""}><span>${esc(c)}</span></label>`).join("");
    $("#ctxt").textContent=`${ticks.length} of ${CHECK.length} checked`;$("#cbar").style.width=(ticks.length/CHECK.length*100)+"%";
  }
  drawC();
  $("#checks").onchange=e=>{const i=+e.target.dataset.i;ticks=e.target.checked?[...ticks,i]:ticks.filter(x=>x!==i);store.set("zayd-checks",ticks);drawC();if(e.target.checked&&ticks.length===CHECK.length)celebrate2()};
  $("#cclear").onclick=()=>{ticks=[];store.set("zayd-checks",ticks);drawC()};
}

function wirePractice(){
  let cp=null, revealed=false, secs=600, running=false;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  function stop(){if(practiceTimer){clearInterval(practiceTimer);practiceTimer=null}running=false}
  function draw(){
    const p=cp;
    $("#pbox").innerHTML=`<div class="pics">${[1,2,3].map(n=>`<figure class="pic" style="margin:0"><img alt="Picture ${n}" src="${picSrc(p,n)}"></figure>`).join("")}</div>
    <div class="pr-actions"><button class="btn" id="spin">Spin again</button><button class="btn ghost" id="reveal">${revealed?"Hide topic":"Reveal topic"}</button><div class="timer" id="timer" aria-live="off">${fmt(secs)}</div><button class="btn ghost" id="tstart">${running?"Pause":"Start 10-min plan"}</button><button class="btn ghost" id="treset">Reset</button></div>
    ${revealed?`<div class="reveal"><h3>${esc(p.topic)}</h3><ul class="guide">${p.q.map((q,i)=>`<li><b>${i+1}</b><span>${esc(q)}</span></li>`).join("")}</ul><button class="btn ghost" id="openp">Open ${esc(p.name)} paper</button></div>`:`<p class="note">What do you think the topic is? Which picture would you use?</p>`}`;
    $("#spin").onclick=()=>{pick();draw()};
    $("#reveal").onclick=()=>{revealed=!revealed;draw()};
    $("#tstart").onclick=()=>{if(running){stop();draw();return}running=true;practiceTimer=setInterval(()=>{secs--;const el=$("#timer");if(el)el.textContent=fmt(Math.max(secs,0));if(secs<=0){stop();draw();if($("#timer"))$("#timer").textContent="Time’s up!"}},1000);draw()};
    $("#treset").onclick=()=>{stop();secs=600;draw()};
    const o=$("#openp"); if(o)o.onclick=()=>go(p.id);
  }
  function pick(){const list=PAPERS.filter(x=>x!==cp);cp=list[Math.floor(Math.random()*list.length)];revealed=false;stop();secs=600}
  pick();draw();
  $("#mcolor").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);e.target.textContent="Stage colours: "+(on?"on":"off");document.querySelector(".models").classList.toggle("plain",!on)};
}

const STAGE_COL=["var(--mint)","var(--sky-soft)","var(--sun-soft)","var(--lav)","var(--pink)"];
let practiceTimer=null;
/* ---------- hero art ---------- */
function mountainSVG(){
  return `<svg class="mt paper" viewBox="0 0 620 250" role="img" aria-label="Story mountain: opening, rising action, climax, falling action, resolution">
    <path d="M180 226 L290 130 L420 84 L500 140 L620 226 Z" fill="#E6DDFF"/>
    <path d="M10 226 L90 206 L170 166 L250 122 L330 44 L450 130 L610 226 Z" fill="#C9F0DE"/>
    <path d="M330 44 L310 64.5 L322 60 L332 70 L342 61 L352 60.5 Z" fill="#fff"/>
    <path class="mtn-line" pathLength="1" d="M10 226 L90 206 L170 166 L250 122 L330 44 L450 130 L610 226" style="stroke:var(--orange);stroke-width:5;stroke-dasharray:1 .03" />
    <g transform="translate(330 44)"><line x1="0" y1="0" x2="0" y2="-34" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><path class="flag" d="M0 -34 L26 -26 L0 -18 Z" fill="var(--coral)"/></g>
    <g class="hiker"><circle r="11" cx="0" cy="-12" fill="var(--sun)" stroke="var(--ink)" stroke-width="3"/><circle r="2" cx="-3" cy="-14" fill="var(--ink)"/><circle r="2" cx="4" cy="-14" fill="var(--ink)"/><path d="M-3 -8q3 3 6 0" stroke="var(--ink)" stroke-width="1.6" fill="none"/></g>

/* ---------- home ---------- */
let fTheme="all", fClue="all";
function counts(){
  const t={},c={};
  PAPERS.forEach(p=>{p.themes.forEach(x=>t[x]=(t[x]||0)+1);p.clues.forEach(x=>c[x]=(c[x]||0)+1)});
  return {t,c};
}
function home(){
  const {t,c}=counts();
  const mx=Math.max(...Object.values(t));
  const themeChips=Object.keys(THEMES).map(k=>`<button class="chip" data-theme="${k}" aria-pressed="${fTheme===k}" style="--dot:${THEMES[k].dot}"><span class="dot"></span>${THEMES[k].name}<span class="n">${t[k]}</span><span class="freq" style="--w:${Math.round(t[k]/mx*100)}%"></span></button>`).join("");
  const clueChips=Object.keys(CLUES).map(k=>`<button class="chip" data-clue="${k}" aria-pressed="${fClue===k}"><span class="dot" style="--dot:var(--sun)"></span>${CLUES[k]}<span class="n">${c[k]}</span></button>`).join("");
  $("#app").innerHTML=`
  ${navHtml()}
  <header class="hero">
    <div class="eyebrow">Zayd’s Primary 5 English · SA2 2025</div>
    <h1><span class="l1">write your</span><span class="l2">story</span></h1>
    <p class="lead">Eleven real exam papers, sorted by topic. Pick a paper, climb the story mountain, answer the thinking questions, then plan your adventure.</p>
    <button class="btn" data-jump="filters">Let’s start</button>
    <div class="scene">${sunSVG()}${cloud("#9AD5FA","c1")}${cloud("#FFD3E0","c2")}${cloud("#FFFFFF","c3")}${mountainSVG()}${pencilSVG()}</div>
  </header>

  <div class="panel filters" id="filters">
    <h2>What keeps coming up?</h2>
    <p class="note">Responsibility and lessons appear in most papers. Bars show how often each theme appears.</p>
    <div class="fgroup"><div class="label">Theme</div><div class="chips" id="themeChips"><button class="chip" data-theme="all" aria-pressed="${fTheme==="all"}">All papers<span class="n">${PAPERS.length}</span></button>${themeChips}</div></div>
    <div class="fgroup"><div class="label">Picture clues</div><div class="chips" id="clueChips"><button class="chip" data-clue="all" aria-pressed="${fClue==="all"}">Any</button>${clueChips}</div></div>
  </div>
  <div class="status" aria-live="polite"><span id="count"></span><button id="reset" hidden>Clear filters</button></div>
  <div class="grid" id="grid"></div>

  ${extraSections()}
  <section class="toolkit" id="tips">
    <div><div class="eyebrow">Writing toolkit</div><h2>Eight habits of a strong composition</h2></div>
    <p class="note">Based on the Primary English syllabus: plan and organise ideas, then use rich and varied language. The paper asks for at least 150 words and no more than 10 minutes of planning.</p>
    <div class="tips">${TOOLKIT.map(k=>`<div class="tip"><div class="ico">${k.i}</div><h3>${k.t}</h3><div class="swap"><span class="bad">${esc(k.bad)}</span><span class="good">${esc(k.good)}</span></div></div>`).join("")}</div>
  </section>
  <p class="foot">Made for Zayd from the P5 English EOY papers folder. Pictures are cropped from each paper’s Part 2 page.</p>`;
  $("#themeChips").onclick=e=>{const b=e.target.closest("button");if(!b)return;fTheme=b.dataset.theme;refresh()};
  $("#clueChips").onclick=e=>{const b=e.target.closest("button");if(!b)return;fClue=b.dataset.clue;refresh()};
  $("#reset").onclick=()=>{fTheme="all";fClue="all";refresh()};
  renderGrid(); wireExtras(); wirePractice();
}
function refresh(){
  document.querySelectorAll("#themeChips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.theme===fTheme));
  document.querySelectorAll("#clueChips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.clue===fClue));
  renderGrid();
}
function renderGrid(){
  const list=PAPERS.filter(p=>(fTheme==="all"||p.themes.includes(fTheme))&&(fClue==="all"||p.clues.includes(fClue)));
  $("#count").textContent=`Showing ${list.length} of ${PAPERS.length} papers`;
  $("#reset").hidden=(fTheme==="all"&&fClue==="all");
  const g=$("#grid");
  if(!list.length){g.innerHTML='<div class="empty">No papers match both filters. Try clearing one.</div>';return}
  g.innerHTML=list.map((p,i)=>`
   <button class="card" data-id="${p.id}" style="--i:${i}" aria-label="${esc(p.name)}: ${esc(p.topic)}">
     ${p.noimg?`<div class="noimg">Pictures appear once the Nanyang PDF is added to the folder</div>`:`<div class="thumbs">${[1,2,3].map(n=>`<img alt="" loading="lazy" src="${picSrc(p,n)}">`).join("")}</div>`}
     <div class="school"><span>${esc(p.name)}</span><span class="mono">${p.stamp} · page ${p.pg}</span></div>
     <h3>${esc(p.topic)}</h3>
     <div class="tags">${tagHtml(p)}</div>
     <div class="go">Open this paper ${arrow}</div>
   </button>`).join("");
  g.onclick=e=>{const b=e.target.closest(".card");if(b)go(b.dataset.id)};
}

/* ---------- paper page ---------- */
let walkTimer=null;
let cur=(location.hash||"").slice(1);
function nav(id){cur=id;try{history.pushState(null,"",id?"#"+id:location.pathname+location.search)}catch(e){}route()}
function go(id){nav(id)}
function paperPage(p){
  const d=T[p.key]; const doneKey="zayd-done-"+p.id; const planKey="zayd-plan-"+p.id;
  let done=store.get(doneKey,[]);
  let stage=0;
  $("#app").innerHTML=`
  ${navHtml()}
  <button class="back" id="back">← All papers</button>
  <header class="phead">
    <div class="eyebrow">${esc(p.name)} · ${p.stamp} · page ${p.pg}</div>
    <h1>${esc(p.topic)}</h1>
    <div class="tags">${tagHtml(p)}</div>
    <p class="mono">${p.id}_p${p.pg}_${p.slug}</p>
  </header>

  <div class="panel prompt">
    <div>
      <h3>Write at least 150 words about <b>${esc(p.topic.toLowerCase())}</b></h3>
      <ul class="guide">${p.q.map((q,i)=>`<li><b>${i+1}</b><span>${esc(q)}</span></li>`).join("")}</ul>
      <p class="note" style="margin-top:12px">Use one or more of the pictures. Your own idea: <b>${esc(d.idea)}</b></p>
    </div>
    ${p.noimg?`<div class="noimg" style="min-height:120px">The Nanyang paper is not in the folder yet, so its pictures are missing. Add it and ask Claude to refresh.</div>`:
    `<div class="pics">${[1,2,3].map((n,i)=>`<figure class="pic" style="margin:0"><img alt="Picture ${n}: ${esc(p.hints[i])}" src="${picSrc(p,n)}"><p>${esc(p.hints[i])}</p></figure>`).join("")}</div>`}
  </div>

  <section class="sec">
    <h2>Climb the story mountain</h2>
    <p class="sub">Every good story climbs, peaks, then comes down. Tap a stop, or press Play climb. Each stop shows what to write and a sample for this topic.</p>
    <div class="mtn-wrap">
      <div>
        <svg class="mtn-svg" viewBox="0 0 620 260" role="group" aria-label="Story mountain stages">
          <g class="paper"><path d="M180 232 L290 134 L420 88 L500 144 L620 232 Z" fill="#E6DDFF"/><path d="M10 232 L90 214 L170 170 L250 126 L330 44 L450 134 L610 232 Z" fill="#C9F0DE"/><path d="M330 44 L310 64.5 L322 60 L332 70 L342 61 L352 60.5 Z" fill="#fff"/></g>
          ${STAGES.map((s,i)=>`<g class="stagebtn" data-i="${i}" tabindex="0" role="button" aria-label="${s.n}"><circle cx="${s.x}" cy="${s.y}" r="12"/><text x="${s.x}" y="${s.y+4}">${i+1}</text><text x="${s.x}" y="${s.y+34}" style="font-size:12px">${s.n}</text></g>`).join("")}
          <g class="walker" id="walker"><g class="bob"><circle r="9" cx="0" cy="-34" fill="var(--coral)" stroke="var(--ink)" stroke-width="3"/><path d="M-5 -34 q5 5 10 0" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>
        </svg>
        <div class="mtn-ctrl"><button class="btn" id="play">Play climb</button><button class="btn ghost" id="prev">Back</button><button class="btn ghost" id="next">Next stop</button></div>
      </div>
      <div class="stagebox" id="stagebox" aria-live="polite"></div>
    </div>
    <div><div class="eyebrow" style="margin-bottom:6px">Word bank for this topic</div><div class="words">${d.w.map(w=>`<span>${w}</span>`).join("")}</div></div>
  </section>

  <section class="sec">
    <div class="qhead">
      <div><h2>Think before you write</h2><p class="sub" style="margin-top:4px">Answer each question in your head or out loud. Press Hide example first if you want to try on your own.</p></div>
      <div class="progress"><span id="ptxt"></span><div class="bar"><i id="pbar"></i></div></div>
    </div>
    <div class="mtn-ctrl"><button class="btn ghost" id="toggleAll">Hide all examples</button></div>
    <div class="qlist" id="qlist"></div>
  </section>

  <section class="sec">
    <h2>My story plan</h2>
    <p class="sub">Jot a few words for each stop. Your notes stay in this browser.</p>
    <div class="planner" id="planner">${STAGES.map((s,i)=>`<label for="plan${i}"><span><i></i>${i+1}. ${s.n}</span><textarea id="plan${i}" placeholder="${esc(s.sub)}…"></textarea></label>`).join("")}</div>
  </section>`;

  /* mountain logic */
  const walker=$("#walker"), box=$("#stagebox");
  function setStage(i,anim=true){
    stage=(i+STAGES.length)%STAGES.length; const s=STAGES[stage];
    walker.style.transition=anim?"":"none";
    walker.style.transform=`translate(${s.x}px,${s.y}px)`;
    document.querySelectorAll(".stagebtn").forEach(g=>g.classList.toggle("on",+g.dataset.i===stage));
    box.innerHTML=`<div class="fade" style="display:grid;gap:10px"><span class="badge">Stop ${stage+1} of 5</span><h3>${s.n}: ${s.sub}</h3><p>${s.tip}</p><div class="ex"><span class="exlabel">Example for ${esc(p.topic.toLowerCase())}</span>${esc(d.m[stage])}</div></div>`;
  }
  document.querySelectorAll(".stagebtn").forEach(g=>{
    g.onclick=()=>{stopWalk();setStage(+g.dataset.i)};
    g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();stopWalk();setStage(+g.dataset.i)}};
  });
  $("#next").onclick=()=>{stopWalk();setStage(stage+1)};
  $("#prev").onclick=()=>{stopWalk();setStage(stage-1)};
  function stopWalk(){if(walkTimer){clearInterval(walkTimer);walkTimer=null;$("#play").textContent="Play climb"}}
  $("#play").onclick=()=>{
    if(walkTimer){stopWalk();return}
    setStage(0);$("#play").textContent="Pause";
    walkTimer=setInterval(()=>{if(stage>=4){stopWalk();return}setStage(stage+1)},2600);
  };
  setStage(0,false);

  /* questions */
  const shown=d.q.map(()=>true);
  function drawQ(){
    $("#qlist").innerHTML=d.q.map((x,i)=>`
     <div class="q ${done.includes(i)?"done":""}" data-i="${i}">
       <div class="top"><div class="num">${i+1}</div><div class="text">${esc(x[0])}</div></div>
       <div class="actions">
         <button class="small ex-toggle" aria-expanded="${shown[i]}" aria-controls="ex${i}">${shown[i]?"Hide example":"Show example"}</button>
         <button class="small check" aria-pressed="${done.includes(i)}">${done.includes(i)?"I thought about it ✓":"I thought about it"}</button>
       </div>
       <div class="example" id="ex${i}" ${shown[i]?"":"hidden"}><span class="exlabel">Example answer</span><q>${esc(x[1])}</q></div>
     </div>`).join("");
    progress();
    $("#toggleAll").textContent=shown.every(v=>!v)?"Show all examples":"Hide all examples";
  }
  function progress(){
    const n=done.length,t=d.q.length;
    $("#ptxt").textContent=`${n} of ${t} thought through`;
    $("#pbar").style.width=(n/t*100)+"%";
  }
  $("#qlist").onclick=e=>{
    const q=e.target.closest(".q"); if(!q)return; const i=+q.dataset.i;
    if(e.target.closest(".ex-toggle")){shown[i]=!shown[i];drawQ();return}
    const c=e.target.closest(".check");
    if(c){
      const was=done.includes(i);
      done=was?done.filter(v=>v!==i):[...done,i]; store.set(doneKey,done); drawQ();
      if(!was){burst(c); if(done.length===d.q.length)celebrate()}
    }
  };
  $("#toggleAll").onclick=()=>{const hide=!shown.every(v=>!v);shown.fill(!hide);drawQ()};
  drawQ();

  /* planner */
  const plan=store.get(planKey,{});
  document.querySelectorAll("#planner textarea").forEach((ta,i)=>{
    ta.value=plan[i]||"";
    ta.oninput=()=>{plan[i]=ta.value;store.set(planKey,plan)};
  });
  $("#back").onclick=()=>nav("");
  window.scrollTo(0,0);
}
function burst(el){
  const r=el.getBoundingClientRect(); const b=document.createElement("div"); b.className="burst";
  b.style.left=(r.left+r.width/2)+"px"; b.style.top=(r.top+r.height/2)+"px";
  const cols=["var(--sun)","var(--accent)","var(--coral)","var(--sky)"];
  for(let i=0;i<14;i++){const s=document.createElement("span");const a=Math.PI*2*i/14,d=40+Math.random()*50;
    s.style.cssText=`--c:${cols[i%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*360}deg`;b.appendChild(s)}
  document.body.appendChild(b); setTimeout(()=>b.remove(),1000);
}
function celebrate(){
  const el=$("#pbar"); [0,150,300].forEach(t=>setTimeout(()=>burst(el),t));
  $("#ptxt").textContent="All thought through. Start writing!";
}

document.querySelector(".decor").innerHTML=cloud("#FFFFFF","d1",false)+cloud("#FFFFFF","d2",false)+cloud("#F4FBFF","d3",false);
/* ---------- router ---------- */
function route(){
  if(walkTimer){clearInterval(walkTimer);walkTimer=null}
  if(practiceTimer){clearInterval(practiceTimer);practiceTimer=null}
  const p=PAPERS.find(x=>x.id===cur);
  if(p) paperPage(p); else {home(); window.scrollTo(0,0)}
}
const sync=()=>{cur=(location.hash||"").slice(1);route()};
window.addEventListener("popstate",sync);
window.addEventListener("hashchange",sync);
route();
</script>
